name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. For a security problem, please do not open an issue:
        use **Report a vulnerability** on the Security tab instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Add a mock for …
        3. …
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Browser
      options: [Chrome, Firefox, Other Chromium-based]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: oMockman version
      placeholder: "2.3.3"
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, console errors, a minimal page that reproduces it.
