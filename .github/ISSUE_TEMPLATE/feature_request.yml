name: Feature request
description: Suggest an idea for oMockman
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: The solution you would like
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you have considered
