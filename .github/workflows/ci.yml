name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run eslint
      - run: npm run stylelint
      - run: npm run typescript
      - run: npm run playwright:typecheck
      - name: Third-party notices are up to date
        run: |
          npm run build:chrome
          npm run build:firefox
          npm run notices:check

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run vitest:coverage
      - uses: actions/upload-artifact@v7
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 1

  coverage-badge:
    name: Coverage badge
    needs: unit
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: coverage-summary
      - name: Publish to the badges branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pct=$(node -p "require('./coverage-summary.json').total.lines.pct")
          color=$(node -p "const p = $pct; p >= 80 ? 'brightgreen' : p >= 60 ? 'green' : p >= 50 ? 'yellowgreen' : 'orange'")
          mkdir badges && cd badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$pct" "$color" > coverage.json
          cat coverage.json
          # A one-commit orphan branch, replaced on every run: it holds only the badge file.
          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add coverage.json
          git commit -q -m "Coverage ${pct}%"
          git push -q --force "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges

  build:
    name: Build (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build:${{ matrix.browser }}
      - uses: actions/upload-artifact@v7
        with:
          name: omockman-${{ matrix.browser }}
          path: dist/${{ matrix.browser }}
          retention-days: 14

  e2e:
    name: End-to-end
    # The screenshot baselines are rendered on macOS; fonts differ on Linux.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - run: npm run build:chrome
      - run: npm run playwright
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: test-results
          retention-days: 7
