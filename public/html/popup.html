<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      :root{
        color-scheme: light;
        --bg: #ffffff;
        --text: #000000;
        --accent: #0043e8;
        --key-bg: #eeeeee;
        --key-border: #b4b4b4;
        --key-text: #333333;
        --key-shadow: 0 1px 1px rgba(0, 0, 0, .2), 0 2px 0 0 rgba(255, 255, 255, .7) inset;
        --muted: #6b6b6b;
      }
      @media (prefers-color-scheme: dark){
        :root:not([data-theme="light"]){
          color-scheme: dark;
          --bg: #222222;
          --text: #ffffff;
          --accent: #6ea8fe;
          --key-bg: #333333;
          --key-border: #555555;
          --key-text: #eeeeee;
          --key-shadow: 0 1px 1px rgba(0, 0, 0, .5), 0 1px 0 0 rgba(255, 255, 255, .08) inset;
          --muted: #a0a0a0;
        }
      }
      :root[data-theme="dark"]{
        color-scheme: dark;
        --bg: #222222;
        --text: #ffffff;
        --accent: #6ea8fe;
        --key-bg: #333333;
        --key-border: #555555;
        --key-text: #eeeeee;
        --key-shadow: 0 1px 1px rgba(0, 0, 0, .5), 0 1px 0 0 rgba(255, 255, 255, .08) inset;
        --muted: #a0a0a0;
      }
      body{
        font-size: 13px;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      #wrapper{
        width: 240px;
        padding: 14px 16px 12px;
        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      .brand{
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand img{
        width: 32px;
        height: 32px;
      }
      .brand h1{
        margin: 0;
        font-size: 16px;
        font-weight: 700;
      }
      .toggle-row{
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        border: 1px solid var(--key-border);
        border-radius: 8px;
        cursor: pointer;
      }
      .toggle-row[aria-disabled="true"]{
        cursor: default;
        opacity: .6;
      }
      #mocking-label{
        font-weight: 600;
        display: inline-block;
      }
      #mocking-label.changed{
        animation: label-in 220ms ease-out;
      }
      @keyframes label-in{
        from{
          opacity: 0;
          transform: translateY(4px);
        }
        to{
          opacity: 1;
          transform: translateY(0);
        }
      }
      .toggle-row{
        transition: border-color 200ms ease, background-color 200ms ease;
      }
      .toggle-row.on{
        border-color: #21ba45;
        background-color: rgba(33, 186, 69, .08);
      }
      @media (prefers-reduced-motion: reduce){
        #mocking-label.changed{
          animation: none;
        }
        .toggle-row, .slider, .slider::before{
          transition: none;
        }
      }
      .switch{
        position: relative;
        flex: none;
        width: 40px;
        height: 22px;
      }
      .switch input{
        position: absolute;
        opacity: 0;
        width: 100%;
        height: 100%;
        margin: 0;
        cursor: inherit;
      }
      .slider{
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: var(--key-border);
        transition: background-color 150ms ease;
        pointer-events: none;
      }
      .slider::before{
        content: '';
        position: absolute;
        top: 3px;
        left: 3px;
        width: 16px;
        height: 16px;
        border-radius: 50%;
        background: #ffffff;
        transition: transform 150ms ease;
      }
      .switch input:checked + .slider{
        background: #21ba45;
      }
      .switch input:checked + .slider::before{
        transform: translateX(18px);
      }
      .switch input:focus-visible + .slider{
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .hint{
        margin: 0;
        color: var(--muted);
      }
      .hint kbd{
        background-color: var(--key-bg);
        border: 1px solid var(--key-border);
        border-radius: 3px;
        box-shadow: var(--key-shadow);
        color: var(--key-text);
        font: 700 11px/1 inherit;
        padding: 2px 4px;
      }
      footer{
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: var(--muted);
        font-size: 12px;
      }
      footer a{
        color: var(--accent);
        text-decoration: none;
      }
      footer a:hover{
        text-decoration: underline;
      }
    </style>
    <script type="module" src="/src/popup.ts"></script>
    <title>Mockman</title>
  </head>
  <body>
    <div id="wrapper">
      <div class="brand">
        <img src="../icons/mockman.svg" alt="" />
        <h1>Mockman</h1>
      </div>
      <label class="toggle-row" id="mocking-row" aria-disabled="true">
        <span id="mocking-label">Mocking</span>
        <span class="switch">
          <input type="checkbox" id="mocking-toggle" role="switch" disabled />
          <span class="slider"></span>
        </span>
      </label>
      <p class="hint" id="hint">Panel: <kbd>F12</kbd> → Mockman tab</p>
      <footer>
        <span id="version"></span>
        <a id="docs" target="_blank" rel="noreferrer">Docs</a>
      </footer>
    </div>
  </body>
</html>
